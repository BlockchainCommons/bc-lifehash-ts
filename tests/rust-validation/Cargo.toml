[package]
name = "lifehash-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The tracked reference release (see .github/versions.yml). To validate a
# local checkout instead, add a `[patch.crates-io]` entry pointing at it.
bc-lifehash = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
